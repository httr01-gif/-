<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>면접 프로필 스튜디오 · AI 보정</title>
<style>
  @font-face { font-family:"Pretendard"; font-weight:400; font-display:swap;
    src:url("https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2") format("woff2"); }
  @font-face { font-family:"Pretendard"; font-weight:500; font-display:swap;
    src:url("https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Medium.woff2") format("woff2"); }
  @font-face { font-family:"Pretendard"; font-weight:600; font-display:swap;
    src:url("https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-SemiBold.woff2") format("woff2"); }
  @font-face { font-family:"Pretendard"; font-weight:800; font-display:swap;
    src:url("https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-ExtraBold.woff2") format("woff2"); }

  :root{
    --bg:#0f1320; --panel:#171c2c; --panel-2:#1e2438; --line:#2a3148;
    --ink:#eef1f7; --ink-soft:#9aa3bd; --ink-faint:#6b7591;
    --blue:#5b8cff; --blue-press:#477bf5; --accent:#7af0c7; --warn:#ffb454;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{
    font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo",sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(91,140,255,.12), transparent 60%),
      radial-gradient(900px 500px at 0% 110%, rgba(122,240,199,.08), transparent 55%),
      var(--bg);
    color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.55;
  }

  header{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:18px 26px;border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:baseline;gap:12px;min-width:0;}
  .brand .mark{font-weight:800;letter-spacing:-.02em;font-size:19px;white-space:nowrap;}
  .brand .mark .ai{color:var(--accent);}
  .brand .tag{font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.02em;white-space:nowrap;}
  .pill{font-size:11px;font-weight:600;color:#0f1320;background:var(--warn);
    padding:5px 11px;border-radius:99px;white-space:nowrap;}

  main{max-width:1120px;margin:0 auto;padding:24px 22px 60px;
    display:grid;grid-template-columns:330px 1fr;gap:24px;}

  @media (max-width:560px){
    header{padding:13px 16px;gap:8px 12px;flex-wrap:wrap;}
    .brand{flex-direction:column;align-items:flex-start;gap:2px;}
    .brand .mark{font-size:17px;}
    .brand .tag{font-size:9.5px;}
    .pill{font-size:10px;padding:5px 10px;}
  }
  @media (max-width:840px){ main{grid-template-columns:1fr;} }

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;}
  .rail{padding:20px;display:flex;flex-direction:column;gap:20px;height:max-content;}

  .group{display:flex;flex-direction:column;gap:10px;}
  .gtitle{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);
    display:flex;align-items:center;gap:8px;}
  .gtitle .num{color:var(--accent);font-weight:700;}

  .src-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  button.src{font-family:inherit;font-size:13px;font-weight:500;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;
    border:1px solid var(--line);background:var(--panel-2);border-radius:11px;cursor:pointer;
    transition:border-color .15s,transform .05s;}
  button.src:hover{border-color:var(--blue);}
  button.src:active{transform:translateY(1px);}
  button.src svg{width:22px;height:22px;stroke:var(--ink-soft);}

  .seg{display:flex;gap:6px;}
  .seg button{flex:1;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--ink-soft);
    padding:9px 6px;border:1px solid var(--line);background:var(--panel-2);border-radius:9px;cursor:pointer;
    transition:.12s;}
  .seg button[aria-pressed="true"]{border-color:var(--blue);color:var(--ink);background:rgba(91,140,255,.14);}

  .swatches{display:flex;gap:10px;}
  .swatch{width:40px;height:40px;border-radius:10px;cursor:pointer;border:2px solid var(--line);position:relative;padding:0;}
  .swatch[aria-pressed="true"]{border-color:var(--ink);}
  .swatch .name{position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);font-size:10px;color:var(--ink-faint);white-space:nowrap;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;}
  .switch{position:relative;width:40px;height:23px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .track{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.15s;cursor:pointer;}
  .switch .track::before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
  .switch input:checked + .track{background:var(--blue);}
  .switch input:checked + .track::before{transform:translateX(17px);}

  .btn{font-family:inherit;font-size:14px;font-weight:600;width:100%;padding:13px;border-radius:11px;cursor:pointer;border:1px solid transparent;transition:.15s;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{background:var(--blue-press);}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  .btn-ghost{background:var(--panel-2);color:var(--ink);border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--ink-faint);}

  .notice{font-size:11.5px;line-height:1.6;color:var(--ink-soft);
    background:rgba(255,180,84,.1);border:1px solid rgba(255,180,84,.3);border-radius:10px;padding:11px 13px;}
  .notice b{color:var(--warn);}

  /* stage */
  .stage{padding:22px;display:flex;flex-direction:column;gap:18px;min-height:420px;}
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:560px){ .compare{grid-template-columns:1fr;} }
  .pane{display:flex;flex-direction:column;gap:9px;}
  .pane .plabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);}
  .pane .plabel.out{color:var(--accent);}
  .imgbox{position:relative;border-radius:12px;overflow:hidden;background:var(--panel-2);border:1px solid var(--line);
    aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;}
  .imgbox.square{aspect-ratio:1/1;}
  .imgbox img{width:100%;height:100%;object-fit:cover;display:block;}
  .imgbox .ph{display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--ink-faint);font-size:12.5px;text-align:center;padding:20px;}
  .imgbox .ph svg{width:30px;height:30px;stroke:var(--ink-faint);}

  /* loading shimmer */
  .loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:linear-gradient(110deg,var(--panel-2) 30%,rgba(91,140,255,.12) 50%,var(--panel-2) 70%);
    background-size:220% 100%;animation:shine 1.6s linear infinite;}
  @keyframes shine{to{background-position:-220% 0;}}
  .loading .ring{width:34px;height:34px;border:3px solid rgba(255,255,255,.18);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading .msg{font-size:12.5px;color:var(--ink-soft);}
  .loading .elapsed{font-family:var(--mono);font-size:11px;color:var(--ink-faint);}

  .result-actions{display:flex;gap:10px;}
  .result-actions .btn{width:auto;flex:1;}

  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#000;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;
    transition:.2s;z-index:80;max-width:90vw;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* webcam modal */
  .modal-bg{position:fixed;inset:0;background:rgba(8,10,18,.7);z-index:60;display:none;align-items:center;justify-content:center;padding:20px;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:440px;width:100%;}
  .modal h3{margin:2px 0 14px;font-size:15px;font-weight:600;}
  .cam-wrap{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:3/4;}
  .cam-wrap video{width:100%;height:100%;object-fit:cover;display:block;}
  .modal-actions{display:flex;gap:8px;margin-top:14px;}
  .modal-actions .btn{flex:1;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark">면접 프로필 <span class="ai">AI</span> 스튜디오</span>
    <span class="tag">PERSPECTIVE · LIGHTING · BACKGROUND</span>
  </div>
  <span class="pill">증명사진·여권 제출용 아님</span>
</header>

<main>
  <!-- controls -->
  <section class="card rail">
    <div class="group">
      <div class="gtitle"><span class="num">01</span> 원본 사진</div>
      <div class="src-buttons">
        <button class="src" id="btnUpload">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L8 8m4-4l4 4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
          사진 올리기
        </button>
        <button class="src" id="btnCam">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 012-2h2l1.5-2h7L17 6h2a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/><circle cx="12" cy="12.5" r="3.2"/></svg>
          웹캠 촬영
        </button>
      </div>
      <input type="file" id="fileInput" accept="image/*" hidden />
    </div>

    <div class="group">
      <div class="gtitle"><span class="num">02</span> 배경</div>
      <div class="swatches" id="swatches">
        <button class="swatch" data-bg="white" style="background:#ffffff" aria-pressed="true"><span class="name">흰색</span></button>
        <button class="swatch" data-bg="gray" style="background:#cfd3da"><span class="name">회색</span></button>
        <button class="swatch" data-bg="blue" style="background:#aab9d6"><span class="name">블루그레이</span></button>
      </div>
    </div>

    <div class="group">
      <div class="gtitle"><span class="num">03</span> 출력 비율</div>
      <div class="seg" id="ratioSeg">
        <button data-ratio="portrait" aria-pressed="true">세로 3:4</button>
        <button data-ratio="square">정사각 1:1</button>
      </div>
    </div>

    <div class="group">
      <div class="gtitle"><span class="num">04</span> 옵션</div>
      <div class="toggle-row">
        <span>정장 입히기</span>
        <label class="switch"><input type="checkbox" id="attire" /><span class="track"></span></label>
      </div>
    </div>

    <button class="btn btn-primary" id="btnGenerate" disabled>AI 보정하기</button>

    <div class="notice">
      <b>비공식 전용</b> — 원근·조명·배경을 정리한 면접/이력서용 프로필 사진입니다.
      얼굴은 최대한 보존하지만 AI가 픽셀을 다시 생성하므로, <b>여권·비자·증명사진 등 공식 제출용으로 쓰지 마세요.</b>
      공식 규격은 옆 증명사진 도구를 이용하세요.
    </div>
  </section>

  <!-- stage -->
  <section class="card stage">
    <div class="compare">
      <div class="pane">
        <span class="plabel">원본</span>
        <div class="imgbox" id="srcBox">
          <div class="ph" id="srcPh">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="11" r="3.4"/><path d="M5 19c1.5-3 5-4 7-4s5.5 1 7 4"/></svg>
            사진을 올리거나<br/>웹캠으로 촬영하세요
          </div>
        </div>
      </div>
      <div class="pane">
        <span class="plabel out">보정 결과</span>
        <div class="imgbox" id="outBox">
          <div class="ph" id="outPh">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
            여기에 보정본이<br/>표시됩니다
          </div>
        </div>
      </div>
    </div>

    <div class="result-actions" id="resultActions" style="display:none">
      <button class="btn btn-ghost" id="btnRetry">다시 보정</button>
      <button class="btn btn-primary" id="btnDownload">결과 저장 (PNG)</button>
    </div>
  </section>
</main>

<!-- webcam modal -->
<div class="modal-bg" id="camModal">
  <div class="modal">
    <h3>웹캠 촬영</h3>
    <div class="cam-wrap"><video id="camVideo" autoplay playsinline></video></div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="btnCapture">촬영</button>
      <button class="btn btn-ghost" id="btnCancelCam">취소</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const state = { srcDataUrl:null, bg:"white", ratio:"portrait", attire:false, outDataUrl:null };

let toastTimer;
function toast(msg, ms=2600){ const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),ms); }

function setRatioBoxes(){
  const sq = state.ratio==="square";
  $("srcBox").classList.toggle("square",sq);
  $("outBox").classList.toggle("square",sq);
}

// ---- downscale to <=1024 long side, JPEG ----
async function toScaledDataUrl(bitmapOrCanvas){
  const w0 = bitmapOrCanvas.width, h0 = bitmapOrCanvas.height;
  const sc = Math.min(1, 1536/Math.max(w0,h0));
  const w = Math.round(w0*sc), h = Math.round(h0*sc);
  const c = document.createElement("canvas"); c.width=w; c.height=h;
  c.getContext("2d").drawImage(bitmapOrCanvas,0,0,w,h);
  return c.toDataURL("image/jpeg",0.95);
}

function showSource(dataUrl){
  state.srcDataUrl = dataUrl;
  const box=$("srcBox"); box.innerHTML="";
  const img=new Image(); img.src=dataUrl; box.appendChild(img);
  $("btnGenerate").disabled=false;
}

// ---- file / webcam ----
$("btnUpload").onclick=()=>$("fileInput").click();
$("fileInput").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  const bmp=await createImageBitmap(f);
  showSource(await toScaledDataUrl(bmp));
  e.target.value="";
};

let camStream=null;
$("btnCam").onclick=async()=>{
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:1280}},audio:false});
    $("camVideo").srcObject=camStream; $("camModal").classList.add("open");
  }catch(_){ toast("카메라를 사용할 수 없어요. 권한을 확인하세요."); }
};
function closeCam(){ $("camModal").classList.remove("open"); if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;} }
$("btnCancelCam").onclick=closeCam;
$("btnCapture").onclick=async()=>{
  const v=$("camVideo"); const c=document.createElement("canvas");
  c.width=v.videoWidth; c.height=v.videoHeight; c.getContext("2d").drawImage(v,0,0);
  closeCam(); showSource(await toScaledDataUrl(c));
};

// ---- option controls ----
$("swatches").onclick=e=>{const b=e.target.closest(".swatch");if(!b)return;
  state.bg=b.dataset.bg; [...$("swatches").children].forEach(s=>s.setAttribute("aria-pressed",s===b));};
$("ratioSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  state.ratio=b.dataset.ratio; [...$("ratioSeg").children].forEach(s=>s.setAttribute("aria-pressed",s===b)); setRatioBoxes();};
$("attire").onchange=e=>state.attire=e.target.checked;

// ---- generate ----
const MSGS=["원근 왜곡을 펴는 중…","조명을 고르게 정리하는 중…","배경을 정돈하는 중…","얼굴 디테일을 보존하는 중…","마무리하는 중…"];
let timerInt, msgInt;
function startLoading(){
  const box=$("outBox"); box.innerHTML="";
  const el=document.createElement("div"); el.className="loading";
  el.innerHTML=`<div class="ring"></div><div class="msg">보정하는 중…</div><div class="elapsed">0초</div>`;
  box.appendChild(el);
  const t0=Date.now(); let mi=0;
  timerInt=setInterval(()=>{el.querySelector(".elapsed").textContent=Math.round((Date.now()-t0)/1000)+"초";},250);
  msgInt=setInterval(()=>{mi=(mi+1)%MSGS.length; el.querySelector(".msg").textContent=MSGS[mi];},2600);
}
function stopLoading(){ clearInterval(timerInt); clearInterval(msgInt); }

async function generate(){
  if(!state.srcDataUrl) return;
  $("btnGenerate").disabled=true; $("resultActions").style.display="none";
  startLoading();
  try{
    const r=await fetch("/api/generate",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({image:state.srcDataUrl,bg:state.bg,ratio:state.ratio,attire:state.attire}),
    });
    const data=await r.json();
    stopLoading();
    if(!r.ok){ $("outBox").innerHTML=`<div class="ph">보정 실패<br/><span style="font-size:11px;color:var(--ink-faint)">${(data.error||"오류").slice(0,120)}</span></div>`;
      toast(data.error||"보정에 실패했어요."); $("btnGenerate").disabled=false; return; }
    state.outDataUrl=data.image;
    const box=$("outBox"); box.innerHTML=""; const img=new Image(); img.src=data.image; box.appendChild(img);
    $("resultActions").style.display="flex"; $("btnGenerate").disabled=false;
  }catch(e){
    stopLoading(); $("btnGenerate").disabled=false;
    $("outBox").innerHTML=`<div class="ph">네트워크 오류</div>`; toast("요청 중 오류가 발생했어요.");
  }
}
$("btnGenerate").onclick=generate;
$("btnRetry").onclick=generate;
$("btnDownload").onclick=()=>{
  if(!state.outDataUrl)return;
  const a=document.createElement("a"); a.href=state.outDataUrl; a.download="면접프로필.png"; a.click();
};

setRatioBoxes();
</script>
</body>
</html>
